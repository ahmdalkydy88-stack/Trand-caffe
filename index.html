<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trend Cafe | ترند كافيه</title>
    <!-- Google Fonts: Tajawal & Cairo for premium Arabic typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700;900&family=Tajawal:wght@300;500;800&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <!-- Background Elements -->
    <div class="bg-gradient"></div>
    <div class="particles" id="particles"></div>

    <!-- Navigation (Sticky Bottom for Mobile) -->
    <nav class="bottom-nav">
        <a href="#hookah" class="nav-item">
            <img src="assets/icon_hookah.png" alt="Hookah" />
        </a>
        <a href="#crepes" class="nav-item">
            <img src="assets/icon_crepe.png" alt="Crepes" />
        </a>
        <a href="#juices" class="nav-item">
            <img src="assets/icon_juice.png" alt="Juice" />
        </a>
        <a href="#mojito" class="nav-item">
            <img src="assets/icon_mojito.png" alt="Mojito" />
        </a>
        <a href="#cold-drinks" class="nav-item">
            <img src="assets/icon_cold_drink.png" alt="Cold" />
        </a>
        <a href="#hot-drinks" class="nav-item">
            <img src="assets/icon_hot_drink.png" alt="Hot" />
        </a>
    </nav>

    <!-- Hero Section -->
    <header class="hero" id="home">
        <div class="logo-container">
            <img src="assets/logo.png" alt="Trend Cafe Logo" class="main-logo" id="mainLogo" />
            <h1 class="hero-title">Trend Cafe</h1>
            <p class="hero-subtitle">حيث يجتمع الطعم والأناقة</p>
        </div>
        <div class="scroll-indicator">
            <span></span>
        </div>
    </header>

    <!-- Menu Container -->
    <main class="menu-container">

        <!-- Section 1: Hookah (الاراكيل) -->
        <section class="menu-section" id="hookah">
            <div class="section-header">
                <img src="assets/icon_hookah.png" class="section-icon" alt="Hookah Icon">
                <h2 class="section-title">الأراكيل</h2>
            </div>
            <div class="menu-grid" id="hookah-list"></div>
        </section>

        <!-- Section 2: Crepes (كريب) -->
        <section class="menu-section" id="crepes">
            <div class="section-header">
                <img src="assets/icon_crepe.png" class="section-icon" alt="Crepe Icon">
                <h2 class="section-title">كريب</h2>
            </div>
            <div class="menu-grid" id="crepes-list"></div>
        </section>

        <!-- Section 3: Juices (العصائر) -->
        <section class="menu-section" id="juices">
            <div class="section-header">
                <img src="assets/icon_juice.png" class="section-icon" alt="Juice Icon">
                <h2 class="section-title">العصائر</h2>
            </div>
            <div class="menu-grid" id="juices-list"></div>
        </section>

        <!-- Section 4: Mojito (موهيتو) -->
        <section class="menu-section" id="mojito">
            <div class="section-header">
                <img src="assets/icon_mojito.png" class="section-icon" alt="Mojito Icon">
                <h2 class="section-title">موهيتو</h2>
            </div>
            <div class="menu-grid" id="mojito-list"></div>
        </section>

        <!-- Section 5: Cold Drinks (مشروبات باردة) -->
        <section class="menu-section" id="cold-drinks">
            <div class="section-header">
                <img src="assets/icon_cold_drink.png" class="section-icon" alt="Cold Drink Icon">
                <h2 class="section-title">مشروبات باردة</h2>
            </div>
            <div class="menu-grid" id="cold-drinks-list"></div>
        </section>

        <!-- Section 6: Hot Drinks (مشروبات ساخنة) -->
        <section class="menu-section" id="hot-drinks">
            <div class="section-header">
                <img src="assets/icon_hot_drink.png" class="section-icon" alt="Hot Drink Icon">
                <h2 class="section-title">مشروبات ساخنة</h2>
            </div>
            <div class="menu-grid" id="hot-drinks-list"></div>
        </section>

        <!-- Section 7: Fruit Fresh (فروت فريش) -->
        <section class="menu-section" id="fruit-fresh">
            <div class="section-header">
                <img src="assets/icon_fruit_fresh.png" class="section-icon" alt="Fruit Icon">
                <h2 class="section-title">فروت فريش</h2>
            </div>
            <div class="menu-grid" id="fruit-fresh-list"></div>
        </section>

    </main>

    <footer class="footer">
        <p>&copy; 2026 Trend Cafe. All rights reserved.</p>
    </footer>

    <script src="main.js"></script>
</body>

</html>
